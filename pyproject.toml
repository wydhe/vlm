[project]
name = "vlm"
version = "0.1.0"
description = "Medical multimodal QA stack: nano-vllm based inference engine, GRPO alignment, agentic RAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.*",
    "transformers>=4.57,<5",
    "flash-attn==2.8.3",
    "nano-vllm",
    "numpy",
    "xxhash",
    "huggingface-hub",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
# Root is a workspace of scripts/packages, not a distributable wheel.
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
nano-vllm = { path = "engine", editable = true }
# Prebuilt wheel: avoids compiling flash-attn from source (torch 2.8 / CUDA 12 / cp312 / cxx11abi=TRUE).
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = ["engine"]
